[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# keep CI green without being pedantic: core correctness rules only
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501", "E702"]  # import-order, line length, compact plot lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
