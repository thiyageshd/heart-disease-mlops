<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2a4f">Heart Disease MLOps — End-to-End Architecture</text>

  <!-- Lane labels -->
  <text x="20" y="90" font-size="13" font-weight="bold" fill="#888">DEVELOPMENT</text>
  <text x="20" y="300" font-size="13" font-weight="bold" fill="#888">CI/CD</text>
  <text x="20" y="470" font-size="13" font-weight="bold" fill="#888">SERVING &amp; OPS</text>

  <!-- ===== Development lane ===== -->
  <rect x="60" y="100" width="150" height="70" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="135" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a4f">Dataset</text>
  <text x="135" y="150" text-anchor="middle" font-size="11" fill="#444">UCI Cleveland CSV</text>

  <rect x="250" y="100" width="150" height="70" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="325" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a4f">Preprocess</text>
  <text x="325" y="144" text-anchor="middle" font-size="11" fill="#444">clean + impute</text>
  <text x="325" y="159" text-anchor="middle" font-size="11" fill="#444">scale + one-hot</text>

  <rect x="440" y="100" width="150" height="70" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="515" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a4f">Train + Tune</text>
  <text x="515" y="144" text-anchor="middle" font-size="11" fill="#444">LogReg + RF</text>
  <text x="515" y="159" text-anchor="middle" font-size="11" fill="#444">stratified CV</text>

  <rect x="630" y="100" width="160" height="70" rx="8" fill="#fdf0e3" stroke="#d9a441" stroke-width="2"/>
  <text x="710" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a00">MLflow</text>
  <text x="710" y="144" text-anchor="middle" font-size="11" fill="#444">params, metrics,</text>
  <text x="710" y="159" text-anchor="middle" font-size="11" fill="#444">plots, model</text>

  <rect x="830" y="100" width="160" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="910" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Model artifact</text>
  <text x="910" y="150" text-anchor="middle" font-size="11" fill="#444">heart_pipeline.joblib</text>

  <!-- arrows dev -->
  <g stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="135" x2="248" y2="135"/>
    <line x1="400" y1="135" x2="438" y2="135"/>
    <line x1="590" y1="135" x2="628" y2="135"/>
    <line x1="790" y1="135" x2="828" y2="135"/>
  </g>

  <!-- ===== CI/CD lane ===== -->
  <rect x="60" y="310" width="170" height="70" rx="8" fill="#f0e8fb" stroke="#7b3ff2" stroke-width="2"/>
  <text x="145" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a1d96">git push</text>
  <text x="145" y="355" text-anchor="middle" font-size="11" fill="#444">GitHub repo</text>

  <rect x="270" y="300" width="470" height="90" rx="8" fill="#f7f2ff" stroke="#7b3ff2" stroke-width="2"/>
  <text x="505" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a1d96">GitHub Actions CI</text>
  <rect x="285" y="335" width="100" height="42" rx="6" fill="#ffffff" stroke="#7b3ff2"/>
  <text x="335" y="361" text-anchor="middle" font-size="11" fill="#444">lint (ruff)</text>
  <rect x="400" y="335" width="100" height="42" rx="6" fill="#ffffff" stroke="#7b3ff2"/>
  <text x="450" y="361" text-anchor="middle" font-size="11" fill="#444">pytest</text>
  <rect x="515" y="335" width="100" height="42" rx="6" fill="#ffffff" stroke="#7b3ff2"/>
  <text x="565" y="361" text-anchor="middle" font-size="11" fill="#444">train</text>
  <rect x="630" y="335" width="95" height="42" rx="6" fill="#ffffff" stroke="#7b3ff2"/>
  <text x="677" y="356" text-anchor="middle" font-size="10" fill="#444">artifact</text>
  <text x="677" y="369" text-anchor="middle" font-size="10" fill="#444">upload</text>

  <rect x="790" y="310" width="200" height="70" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="890" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a4f">Docker image</text>
  <text x="890" y="355" text-anchor="middle" font-size="11" fill="#444">FastAPI + model</text>

  <g stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="230" y1="345" x2="268" y2="345"/>
    <line x1="740" y1="345" x2="788" y2="345"/>
  </g>

  <!-- ===== Serving lane ===== -->
  <rect x="60" y="490" width="200" height="80" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="160" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Kubernetes</text>
  <text x="160" y="537" text-anchor="middle" font-size="11" fill="#444">Deployment (2 pods)</text>
  <text x="160" y="553" text-anchor="middle" font-size="11" fill="#444">Service / LoadBalancer</text>

  <rect x="320" y="490" width="200" height="80" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="420" y="515" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a4f">FastAPI</text>
  <text x="420" y="534" text-anchor="middle" font-size="11" fill="#444">/predict  /health</text>
  <text x="420" y="550" text-anchor="middle" font-size="11" fill="#444">/metrics</text>

  <rect x="580" y="490" width="200" height="80" rx="8" fill="#fdf0e3" stroke="#d9a441" stroke-width="2"/>
  <text x="680" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a00">Prometheus</text>
  <text x="680" y="538" text-anchor="middle" font-size="11" fill="#444">scrapes /metrics</text>

  <rect x="840" y="490" width="200" height="80" rx="8" fill="#fce8e6" stroke="#c0392b" stroke-width="2"/>
  <text x="940" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2018">Grafana</text>
  <text x="940" y="538" text-anchor="middle" font-size="11" fill="#444">dashboards</text>

  <g stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="530" x2="318" y2="530"/>
    <line x1="520" y1="530" x2="578" y2="530"/>
    <line x1="780" y1="530" x2="838" y2="530"/>
  </g>

  <!-- cross-lane arrows -->
  <g stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arrowg)" stroke-dasharray="5,4">
    <line x1="910" y1="170" x2="890" y2="308"/>
  </g>
  <text x="905" y="245" font-size="10" fill="#2e7d32">baked into image</text>
  <g stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#arrowb)" stroke-dasharray="5,4">
    <line x1="890" y1="380" x2="200" y2="488"/>
  </g>
  <text x="470" y="440" font-size="10" fill="#2b6cb0">deploy to cluster</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#888"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2b6cb0"/></marker>
  </defs>
</svg>
