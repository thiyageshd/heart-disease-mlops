# Optional: host-based routing via an Ingress controller.
# On Minikube: `minikube addons enable ingress`, then add
#   `<minikube-ip> heart.local` to /etc/hosts and browse http://heart.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-disease-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: heart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
